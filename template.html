a{color:var(--blue)}
.site{max-width:1200px;margin:0 auto;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.15)}

/* ---------- masthead ---------- */
header{
  position:relative;
  background:#fff;
  border-bottom:5px solid var(--blue);
  overflow:hidden;
}
.head-inner{
  position:relative;
  display:flex;flex-wrap:wrap;align-items:center;gap:1.4rem 2.2rem;
  padding:2rem clamp(1rem,4vw,3rem) 1.8rem;
}
.logo{height:118px;width:auto;flex:none}
.overline{
  font-family:"Roboto",sans-serif;
  font-weight:400;
  font-size:.72rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--blue);
}
h1{
  font-family:"Roboto",sans-serif;
  font-weight:700;
  font-size:clamp(1.9rem,4.5vw,2.6rem);
  letter-spacing:-.01em;
  line-height:1.1;
  color:var(--ink);
  margin:.25rem 0 .1rem;
}
h1 em{font-style:normal;font-weight:300;color:var(--blue)}
.sub{
  font-family:"Roboto",sans-serif;
  font-weight:300;
  font-size:.78rem;
  color:var(--muted);
  margin-top:.45rem;
}
.stats{
  display:flex;flex-wrap:wrap;gap:0;
  margin-top:1rem;
  border:1px solid var(--line);
  width:fit-content;
}
.stats div{
  padding:.5rem 1.1rem;
  border-right:1px solid var(--line);
  font-family:"Roboto",sans-serif;
  font-weight:300;
  font-size:.7rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}
.stats div:last-child{border-right:0}
.stats b{
  display:block;
  font-family:"Roboto",sans-serif;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:0;
  color:var(--ink);
}
.stats .st-open b{color:var(--blue)}
.stats .st-full b{color:var(--red)}

/* ---------- group planner ---------- */
.plan{
  background:#fff;
  border-bottom:1px solid var(--line);
  border-left:5px solid transparent;
  padding:1.2rem clamp(1rem,4vw,3rem) 1.3rem;
}
.plan.active{border-left-color:var(--blue)}
.plan-head{
  font-family:"Roboto",sans-serif;
  font-weight:300;
  font-size:1.5rem;
  margin-bottom:.9rem;
}
.plan-head em{font-style:normal;font-weight:700;color:var(--blue)}
.plan-head .anchor{color:var(--blue);margin-right:.3rem}
.plan-controls{display:flex;flex-wrap:wrap;gap:1rem 1.8rem;align-items:flex-end}
.ctl label{
  display:block;
  font-family:"Roboto",sans-serif;
  font-weight:500;
  font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
  margin-bottom:.35rem;
}
.stepper{display:flex;align-items:stretch;border:1px solid #ccc;background:#fff}
.stepper button{
  font-family:"Roboto",sans-serif;font-size:1rem;font-weight:600;
  width:2rem;border:0;background:transparent;color:var(--ink);cursor:pointer;
}
.stepper button:hover{background:var(--blue);color:#fff}
.stepper .val{
  font-family:"Roboto",sans-serif;font-size:1.1rem;font-weight:700;
  min-width:2.4rem;text-align:center;align-self:center;
  border-left:1px solid #ccc;border-right:1px solid #ccc;
  padding:.15rem 0;
}
.plan select{
  font-family:"Roboto",sans-serif;font-size:.8rem;
  padding:.5rem .6rem;
  border:1px solid #ccc;border-radius:0;
  background:#fff;color:var(--ink);
  -webkit-appearance:none;appearance:none;
  cursor:pointer;
}
.plan select:focus{outline:2px solid var(--blue);outline-offset:1px}
.rolechips{display:flex;gap:.4rem}
.plan-summary{
  flex:1;min-width:14rem;
  font-family:"Roboto",sans-serif;font-weight:300;font-size:.78rem;
  color:var(--muted);
  padding-bottom:.4rem;
}
.plan-summary b{color:var(--green);font-size:.95rem;font-weight:700}
.plan-summary.none b{color:var(--red)}
.plan-reset{
  font-family:"Roboto",sans-serif;font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;
  background:none;border:0;cursor:pointer;
  color:var(--red);text-decoration:underline;
  padding-bottom:.5rem;
  display:none;
}
.plan.active .plan-reset{display:inline}

/* chips — default (white panels): outlined, blue when active */
.chip{
  font-family:"Roboto",sans-serif;
  font-weight:400;
  font-size:.7rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:.45rem .75rem;
  border:1px solid #ccc;
  background:#fff;
  color:#555;
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- filter bar (site nav treatment: solid blue, yellow hover) ---------- */
.bar{
  position:sticky;top:0;z-index:10;
  background:var(--blue);
  box-shadow:0 2px 6px rgba(0,0,0,.18);
  padding:.65rem clamp(1rem,4vw,3rem);
  display:flex;flex-wrap:wrap;gap:.55rem;align-items:center;
}
.search{
  font-family:"Roboto",sans-serif;
  font-size:.82rem;
  padding:.5rem .8rem;
  border:0;
  background:#fff;
  color:var(--ink);
  width:15rem;max-width:100%;
}
.search:focus{outline:2px solid var(--yellow);outline-offset:1px}
.bar .chip{
  background:transparent;
  border:1px solid rgba(255,255,255,.55);
  color:#fff;
}
.bar .chip:hover{border-color:var(--yellow);color:var(--yellow)}
.bar .chip.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.bar .chip.toggle.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.spacer{flex:1}
.count{
  font-family:"Roboto",sans-serif;font-weight:300;
  font-size:.74rem;color:rgba(255,255,255,.9);
}

/* ---------- month nav ---------- */
.monthnav{
  display:flex;flex-wrap:wrap;gap:.3rem;
  padding:.9rem clamp(1rem,4vw,3rem) 0;
}
.monthnav a{
  font-family:"Roboto",sans-serif;
  font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;
  padding:.3rem .55rem;
  border-bottom:2px solid transparent;
  color:var(--blue);
}
.monthnav a:hover{color:var(--blue-dark);border-color:var(--yellow)}

/* ---------- agenda ---------- */
main{padding:0 clamp(1rem,4vw,3rem) 4rem}
/* month heading = the site's .special-title: thin rule + 70px blue accent bar */
.month{
  font-family:"Roboto",sans-serif;
  font-weight:300;
  font-size:clamp(1.6rem,3vw,2.1rem);
  color:var(--ink);
  margin:2.4rem 0 .6rem;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  position:relative;
  scroll-margin-top:4.5rem;
}
.month::after{
  content:'';width:70px;height:0;
  border-top:4px solid var(--blue);
  position:absolute;left:0;bottom:-2px;
}
.day{
  display:grid;
  grid-template-columns:5.2rem 1fr;
  gap:1.2rem;
  padding:1.15rem 0;
  border-bottom:1px solid var(--line);
}
.datecell{text-align:center;padding-top:.2rem}
.datecell .dow{
  font-family:"Roboto",sans-serif;
  font-weight:600;
  font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--blue);
}
.datecell .num{
  font-family:"Roboto",sans-serif;
  font-size:2.2rem;font-weight:300;line-height:1.1;
}
.datecell.today .num{color:var(--blue);font-weight:500}
.datecell .today-tag{
  display:inline-block;
  font-family:"Roboto",sans-serif;font-size:.58rem;font-weight:600;
  letter-spacing:.12em;
  background:var(--yellow);color:var(--ink);
  padding:.1rem .35rem;
  margin-top:.15rem;
}
.evlist{display:flex;flex-direction:column;gap:.6rem}
.ev{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;
  border:1px solid var(--line);
  background:#fff;
  padding:.7rem .9rem;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
  transition:border-color .15s, box-shadow .15s;
}
.ev:hover{border-color:var(--blue);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.ev.dim{opacity:.6}
.ev .time{
  font-family:"Roboto",sans-serif;
  font-size:.78rem;font-weight:600;white-space:nowrap;
  color:var(--blue);
  min-width:7.2rem;
}
.ev .name{font-family:"Roboto",sans-serif;font-weight:700;font-size:.92rem}
.ev .headline{font-style:italic;color:var(--muted);font-size:.85rem}
.ev .cat{
  font-family:"Roboto",sans-serif;
  font-weight:500;
  font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--blue);
  border:1px solid var(--blue);
  padding:.14rem .42rem;
}
.ev .multi{
  font-family:"Roboto",sans-serif;
  font-size:.66rem;letter-spacing:.05em;
  color:var(--amber);
}
.ev .grow{flex:1}
.pill{
  font-family:"Roboto",sans-serif;
  font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:.32rem .6rem;
  white-space:nowrap;
}
.pill.open{background:var(--green-bg);color:var(--green)}
.pill.full{background:var(--red-bg);color:var(--red)}
.pill.call{background:var(--amber-bg);color:var(--amber)}
.pill.closed{background:#eee;color:var(--muted)}
/* book button = the site's FareHarbor .fh-button (Roboto 300 on #3e8ab3) */
.book{
  font-family:"Roboto",sans-serif;
  font-size:.78rem;font-weight:300;letter-spacing:.06em;text-transform:uppercase;
  text-decoration:none;
  background:var(--blue-fh);color:#fff;
  padding:.5rem 1rem;
  white-space:nowrap;
  transition:background .15s;
}
.book:hover{background:var(--blue)}
.empty{
  margin:4rem 0;text-align:center;
  font-style:italic;
  font-size:1.3rem;color:var(--muted);
}
footer{
  background:var(--footer-bg);
  padding:2rem clamp(1rem,4vw,3rem) 2.5rem;
  font-family:"Roboto",sans-serif;
  font-weight:300;
  font-size:.78rem;color:var(--footer-tx);
}
footer code{background:rgba(255,255,255,.08);color:#cfccc9;padding:.15rem .4rem}
@media(max-width:640px){
  .day{grid-template-columns:3.4rem 1fr;gap:.7rem}
  .datecell .num{font-size:1.6rem}
  .ev .time{min-width:0}
  .logo{height:84px}
}
</style>
</head>

<script>
(function(){
  const D = window.__DATA__;
  if(!D){document.getElementById('agenda').innerHTML='<p class="empty">No data — run harvest.py first.</p>';return}

  const items = D.items;
  const todayStr = new Date().toISOString().slice(0,10);
  // keep events that haven't fully ended
  const events = D.events.filter(e => e.end_at.slice(0,10) >= todayStr);

  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const fmtTime = s => {
    const h=+s.slice(11,13), m=s.slice(14,16);
    const ap=h<12?'a':'p'; const hh=((h+11)%12)+1;
    return hh+(m==='00'?'':':'+m)+ap;
  };
  const fmtShort = s => { const d=new Date(s.slice(0,10)+'T12:00:00'); return DOW[d.getDay()].slice(0,3)+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate(); };

  // header
  document.getElementById('sub').textContent =
    'updated '+D.harvested_at+' · window: today → +'+D.months_ahead+' months';

  const cats = [...new Set(events.map(e=>items[e.item_pk].category))]
    .filter(c=>c!=='Waitlists').sort();

  // state
  let state = {q:'', cat:'All', openOnly:false, waitlists:false,
               people:1, level:9, role:'either'};
  const groupActive = () => state.people>1 || state.level!==9 || state.role!=='either';

  // Effective bookable seats per type: FareHarbor caps one booking at
  // maximum_party_size, so what you can book NOW is min(remaining, max/booking).
  // spots entries are [label, capacity_remaining, maximum_party_size].
  const effSpots = e => (e.spots||[]).filter(s=>s[1]!=null)
    .map(s=>({label:s[0], eff:(s[2]!=null?Math.min(s[1],s[2]):s[1]), raw:s[1], max:s[2]}));

  // fits: experience, role, and enough bookable spots for the party
  function fitsGroup(e){
    if(!groupActive()) return true;
    const it=items[e.item_pk];
    if(state.level!==9 && it.min_level>state.level) return false;
    if(state.role!=='either' && it.role!=='both' && it.role!==state.role) return false;
    if(e.sold_out) return false;
    if(!e.bookable && !e.phone_only) return false;
    // seat check: prefer per-type counts (skipper/crew) when harvested
    const typed=effSpots(e);
    if(typed.length){
      const sum=a=>a.reduce((t,s)=>t+s.eff,0);
      const crew=typed.filter(s=>/crew/i.test(s.label));
      const skip=typed.filter(s=>/skipper|captain/i.test(s.label));
      if(state.role==='crew' && crew.length){
        if(sum(crew)<state.people) return false;          // whole group rides as crew
      }else if(state.role==='learn' && skip.length){
        if(sum(skip)<1 || sum(typed)<state.people) return false; // need the helm + seats for all
      }else{
        if(sum(typed)<state.people) return false;
      }
    }else{
      const c=e.capacity;
      if(c!=null && c>0 && c<state.people) return false; // 0/null = capacity unknown
    }
    return true;
  }

  // group planner controls
  const planEl=document.getElementById('plan');
  const pVal=document.getElementById('pVal');
  const roleLabels={either:'either',learn:'learning / captaining',crew:'crewing (captain provided)'};
  const levelLabels={9:'any experience',0:'new to sailing',1:'ASA 101',2:'ASA 103',3:'ASA 104+'};
  document.getElementById('pMinus').onclick=()=>{state.people=Math.max(1,state.people-1);pVal.textContent=state.people;render()};
  document.getElementById('pPlus').onclick=()=>{state.people=Math.min(12,state.people+1);pVal.textContent=state.people;render()};
  document.getElementById('pLevel').onchange=e=>{state.level=+e.target.value;render()};
  planEl.querySelectorAll('[data-role]').forEach(b=>{
    b.onclick=()=>{state.role=b.dataset.role;
      planEl.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));
      render()};
  });
  document.getElementById('pReset').onclick=()=>{
    state.people=1;state.level=9;state.role='either';
    pVal.textContent='1';
    document.getElementById('pLevel').value='9';
    planEl.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role==='either'));
    render();
  };

  function updatePlanSummary(){
    const sEl=document.getElementById('pSummary');
    planEl.classList.toggle('active',groupActive());
    if(!groupActive()){
      sEl.classList.remove('none');
      sEl.innerHTML='set people, experience &amp; role to see what fits your group';
      return;
    }
    const fit=events.filter(e=>fitsGroup(e) && (state.waitlists || items[e.item_pk].category!=='Waitlists')).length;
    sEl.classList.toggle('none',fit===0);
    sEl.innerHTML='<b>'+fit+'</b> sailings fit · '+state.people+
      (state.people>1?' people':' person')+' · '+levelLabels[state.level]+' · '+roleLabels[state.role];
  }

  // chips
  const chipsEl = document.getElementById('chips');
  ['All',...cats].forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'+(c==='All'?' on':'');
    b.textContent=c;
    b.onclick=()=>{state.cat=c;
      chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===c));
      render();};
    chipsEl.appendChild(b);
  });
  document.getElementById('q').oninput = e=>{state.q=e.target.value.toLowerCase();render()};
  document.getElementById('tOpen').onclick = e=>{state.openOnly=!state.openOnly;e.target.classList.toggle('on',state.openOnly);render()};
  document.getElementById('tWait').onclick = e=>{state.waitlists=!state.waitlists;e.target.classList.toggle('on',state.waitlists);render()};

  function status(e){
    if(e.sold_out) return ['full', items[e.item_pk].sold_out_text || 'Sold out'];
    if(e.bookable){
      const c=e.capacity;
      return ['open', (c && c>0) ? c+' spot'+(c>1?'s':'') : 'open'];
    }
    if(e.phone_only) return ['call','call to book'];
    return ['closed','closed'];
  }

  function visible(){
    return events.filter(e=>{
      const it=items[e.item_pk];
      if(it.category==='Waitlists' && !state.waitlists) return false;
      if(state.cat!=='All' && it.category!==state.cat) return false;
      if(!fitsGroup(e)) return false;
      if(state.openOnly){const [k]=status(e); if(k!=='open') return false;}
      if(state.q && !(it.name+' '+e.headline).toLowerCase().includes(state.q)) return false;
      return true;
    });
  }

  function render(){
    updatePlanSummary();
    const list = visible();
    document.getElementById('count').textContent = list.length+' of '+events.length+' events';

    // stats (static, on all events)
    const open = events.filter(e=>status(e)[0]==='open').length;
    const full = events.filter(e=>e.sold_out).length;
    document.getElementById('stats').innerHTML =
      '<div>events<b>'+events.length+'</b></div>'+
      '<div class="st-open">bookable<b>'+open+'</b></div>'+
      '<div class="st-full">sold out<b>'+full+'</b></div>'+
      '<div>programs<b>'+Object.values(items).filter(i=>events.some(e=>e.item_pk===i.pk)).length+'</b></div>';

    // group by date
    const byDate = new Map();
    list.forEach(e=>{
      const d=e.start_at.slice(0,10);
      if(!byDate.has(d)) byDate.set(d,[]);
      byDate.get(d).push(e);
    });

    const agenda=document.getElementById('agenda');
    const nav=document.getElementById('monthnav');
    agenda.innerHTML=''; nav.innerHTML='';
    if(!byDate.size){agenda.innerHTML='<p class="empty">Nothing on the horizon matches — clear a filter or two.</p>';return}

    let curMonth='';
    [...byDate.keys()].sort().forEach(dateStr=>{
      const d=new Date(dateStr+'T12:00:00');
      const mKey=MONTHS[d.getMonth()]+' '+d.getFullYear();
      if(mKey!==curMonth){
        curMonth=mKey;
        const id='m'+d.getFullYear()+'-'+d.getMonth();
        const h=document.createElement('h2');
        h.className='month'; h.id=id; h.textContent=mKey;
        agenda.appendChild(h);
        const a=document.createElement('a');
        a.href='#'+id; a.textContent=MONTHS[d.getMonth()].slice(0,3)+' ’'+String(d.getFullYear()).slice(2);
        nav.appendChild(a);
      }
      const row=document.createElement('div'); row.className='day';
      const isToday=dateStr===todayStr;
      row.innerHTML='<div class="datecell'+(isToday?' today':'')+'">'+
        '<div class="dow">'+DOW[d.getDay()]+'</div>'+
        '<div class="num">'+d.getDate()+'</div>'+
        (isToday?'<div class="today-tag">TODAY</div>':'')+'</div>';
      const lst=document.createElement('div'); lst.className='evlist';

      byDate.get(dateStr)
        .sort((a,b)=>a.start_at.localeCompare(b.start_at))
        .forEach(e=>{
          const it=items[e.item_pk];
          const [k,label]=status(e);
          const multi = e.end_at.slice(0,10)!==e.start_at.slice(0,10);
          const card=document.createElement('div');
          card.className='ev'+(k==='full'||k==='closed'?' dim':'');
          // seat-type breakdown (e.g. skipper / crew) when we have it and
          // the sailing isn't flat-out sold out or closed
          let pills;
          const typed=effSpots(e);
          if((k==='open'||k==='call') && typed.length){
            pills=typed.map(s=>{
              const capped = s.max!=null && s.raw>s.max;
              const tip = capped ? ' title="'+s.raw+' seats remain · booking limited to '+s.max+' per party"' : '';
              return '<span class="pill '+(s.eff>0?'open':'full')+'"'+tip+'>'+
                s.label.toLowerCase()+' '+s.eff+(capped?'*':'')+'</span>';
            }).join('');
            if(k==='call') pills+='<span class="pill call">call to book</span>';
          }else{
            pills='<span class="pill '+k+'">'+label+'</span>';
          }
          card.innerHTML=
            '<span class="time">'+fmtTime(e.start_at)+'–'+fmtTime(e.end_at)+'</span>'+
            '<span><span class="name">'+it.name+'</span>'+
              (e.headline && e.headline!==it.name?' <span class="headline">'+e.headline+'</span>':'')+
              (multi?' <span class="multi">⟶ multi-day · ends '+fmtShort(e.end_at)+'</span>':'')+
            '</span>'+
            '<span class="grow"></span>'+
            '<span class="cat">'+it.category+'</span>'+
            pills+
            (k==='open'?'<a class="book" target="_blank" rel="noopener" href="'+e.book_url+'">book ↗</a>':'');
          lst.appendChild(card);
        });
      row.appendChild(lst);
      agenda.appendChild(row);
    });
  }
  render();
})();
</script>
</body>
</html>
